<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
header{
  background:#4a90e2;
  color:#fff;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
#logout{background:#ff4d4d;color:#fff;border:none;padding:6px 10px;border-radius:6px}

#chat{height:calc(100vh - 220px);overflow-y:auto;padding:10px}
.msg{
  background:#fff;
  padding:8px 10px;
  margin:6px 0;
  border-radius:14px;
  max-width:70%;
  width:fit-content;
  word-wrap:break-word;
}
.me{background:#d9ecff;margin-left:auto}
.name{font-weight:bold;color:#4a90e2;font-size:13px}
.content{white-space:pre-wrap}
.time{font-size:11px;color:#888;text-align:right}
.delete{font-size:12px;color:red;cursor:pointer;text-align:right}
.replyBtn{font-size:12px;color:#4a90e2;cursor:pointer;text-align:right}

.replyPreview{
  font-size:13px;
  background:#f1f1f1;
  padding:5px 8px;
  border-radius:8px;
  margin-bottom:4px;
}

.reactions{display:flex;gap:6px;font-size:16px;margin-top:4px}
.reactions span{cursor:pointer;opacity:.4}
.reactions span.active{opacity:1}

.picker{
  position:absolute;
  background:#fff;
  padding:6px;
  border-radius:20px;
  display:none;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}
.picker span{margin:0 4px;font-size:20px;cursor:pointer}

#typing{font-size:13px;color:#666;padding:5px 10px;height:18px}

#inputBox{display:flex;flex-direction:column;padding:10px;background:#fff}
#sendRow{display:flex;gap:5px}
input{flex:1;padding:10px;font-size:16px}
button{padding:10px}

.replyBox{
  background:#eef6ff;
  padding:6px 10px;
  border-left:4px solid #4a90e2;
  margin-bottom:6px;
  font-size:14px;
  position:relative;
}
.replyBox .close{
  position:absolute;
  right:6px;
  top:4px;
  cursor:pointer;
  color:red;
}

#loginBox{text-align:center;padding:30px}
</style>
</head>

<body>

<header>
  💬 UChat
  <button id="logout" onclick="logout()">Đăng xuất</button>
</header>

<div id="loginBox">
  <input id="username" placeholder="Nhập tên của bạn">
  <br><br>
  <button onclick="doLogin()">Vào chat</button>
</div>

<div id="chat" style="display:none"></div>
<div id="typing"></div>

<div id="inputBox" style="display:none">
  <div id="replyArea"></div>
  <div id="sendRow">
    <input id="text" placeholder="Nhập tin nhắn...">
    <button onclick="send()">Gửi</button>
  </div>
</div>

<audio id="notifySound">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-message-pop-alert-2354.mp3">
</audio>

<script>
const firebaseConfig={
  apiKey:"AIzaSyCxxxxxxxxxxxxxxxxxxxx",
  authDomain:"uchat-406f4.firebaseapp.com",
  databaseURL:"https://uchat-406f4-default-rtdb.firebaseio.com",
  projectId:"uchat-406f4"
};
firebase.initializeApp(firebaseConfig);

const db=firebase.database().ref("uchat");
const typingRef=firebase.database().ref("typing");

const chat=document.getElementById("chat");
const loginBox=document.getElementById("loginBox");
const inputBox=document.getElementById("inputBox");
const typing=document.getElementById("typing");
const notifySound=document.getElementById("notifySound");
const textInput=document.getElementById("text");

let user="";
let firstLoad=true;
let replyTo=null;
const EMOJIS=["👍","😂","😮","😡","❤️"];

/* AUTO LOGIN */
const saved=localStorage.getItem("uchat_name");
if(saved){user=saved;showChat();}

/* LOGIN */
function doLogin(){
  const name=document.getElementById("username").value.trim();
  if(!name) return alert("Nhập tên!");
  user=name;
  localStorage.setItem("uchat_name",name);
  showChat();
}

function showChat(){
  loginBox.style.display="none";
  chat.style.display="block";
  inputBox.style.display="flex";
}

/* LOGOUT */
function logout(){
  if(!confirm("Đổi tên / đăng xuất?")) return;
  localStorage.removeItem("uchat_name");
  user="";
  chat.innerHTML="";
  loginBox.style.display="block";
  chat.style.display="none";
  inputBox.style.display="none";
}

/* WRAP 28 */
function wrap28(text){
  let out="";
  for(let i=0;i<text.length;i+=28){
    out+=text.substring(i,i+28)+"\n";
  }
  return out.trim();
}

/* SEND */
function send(){
  let text=textInput.value.trim();
  if(!text) return;

  db.push({
    name:user,
    msg:wrap28(text),
    time:Date.now(),
    reply:replyTo,
    react:{}
  });

  textInput.value="";
  replyTo=null;
  document.getElementById("replyArea").innerHTML="";
  typingRef.child(user).remove();
}

function timeFormat(t){
  const d=new Date(t);
  return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
}

function toggleReact(id,emoji){
  const ref=db.child(id).child("react").child(emoji).child(user);
  ref.once("value",s=>{
    if(s.exists()) ref.remove();
    else ref.set(true);
  });
}

/* RECEIVE */
db.on("child_added",snap=>{
  const d=snap.val();
  const key=snap.key;
  const isMe=d.name===user;

  const div=document.createElement("div");
  div.className="msg "+(isMe?"me":"");
  div.id=key;

  let replyHTML="";
  if(d.reply){
    replyHTML=`
      <div class="replyPreview">
        <b>${d.reply.name}</b>: ${d.reply.msg}
      </div>
    `;
  }

  const picker=document.createElement("div");
  picker.className="picker";
  EMOJIS.forEach(e=>{
    const s=document.createElement("span");
    s.innerText=e;
    s.onclick=()=>toggleReact(key,e);
    picker.appendChild(s);
  });

  div.innerHTML=`
    <div class="name">${d.name}</div>
    ${replyHTML}
    <div class="content">${d.msg}</div>
    <div class="time">${timeFormat(d.time)}</div>
    <div class="replyBtn" onclick="setReply('${key}')">↩️ Trả lời</div>
    ${isMe?`<div class="delete" onclick="db.child('${key}').remove()">🗑️</div>`:""}
    <div class="reactions"></div>
  `;

  div.appendChild(picker);
  div.onclick=()=>picker.style.display=
    picker.style.display==="block"?"none":"block";

  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;

  if(!firstLoad && !isMe) notifySound.play();
  firstLoad=false;
});

/* REACTION UPDATE */
db.on("child_changed",snap=>{
  const d=snap.val();
  const div=document.getElementById(snap.key);
  if(!div) return;
  const box=div.querySelector(".reactions");
  box.innerHTML="";
  if(!d.react) return;

  for(const e in d.react){
    const count=Object.keys(d.react[e]).length;
    const span=document.createElement("span");
    span.innerText=`${e} ${count}`;
    if(d.react[e][user]) span.classList.add("active");
    box.appendChild(span);
  }
});

/* DELETE */
db.on("child_removed",snap=>{
  document.getElementById(snap.key)?.remove();
});

/* TYPING */
let typingTimer;
textInput.addEventListener("input",()=>{
  typingRef.child(user).set(true);
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>typingRef.child(user).remove(),1200);
});

typingRef.on("value",snap=>{
  const data=snap.val()||{};
  const others=Object.keys(data).filter(n=>n!==user);
  typing.innerText=others.length?others.join(", ")+" đang gõ...":"";
});

/* SET REPLY */
function setReply(id){
  const msg=document.getElementById(id);
  if(!msg) return;
  const name=msg.querySelector(".name").innerText;
  const content=msg.querySelector(".content").innerText;

  replyTo={name:name,msg:content};
  document.getElementById("replyArea").innerHTML=`
    <div class="replyBox">
      Trả lời <b>${name}</b>: ${content}
      <span class="close" onclick="cancelReply()">✖</span>
    </div>
  `;
}
function cancelReply(){
  replyTo=null;
  document.getElementById("replyArea").innerHTML="";
}
</script>

</body>
</html>
