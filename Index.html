<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
header{background:#4a90e2;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}
#logout{background:#ff4d4d;color:#fff;border:none;padding:6px 10px;border-radius:6px}

#chat{height:calc(100vh - 270px);overflow-y:auto;padding:10px}

.msgRow{display:flex;gap:8px;margin:6px 0;align-items:flex-start}
.meRow{justify-content:flex-end}

.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#333}
.male{background:#cfe9ff}
.female{background:#ffd6e7}

.msg{background:#fff;padding:8px 10px;border-radius:14px;max-width:70%}
.me{background:#d9ecff}

.name{font-weight:bold;color:#4a90e2;font-size:13px}
.content{white-space:pre-wrap}
.time{font-size:11px;color:#888;text-align:right}

.replyPreview{
  font-size:12px;color:#555;
  border-left:3px solid #4a90e2;
  padding-left:6px;margin-bottom:4px;
  background:#f1f1f1;border-radius:6px
}

.replyBtn{font-size:12px;color:#4a90e2;cursor:pointer;text-align:right}

#replyBox{
  display:none;background:#eee;padding:6px 10px;
  margin:5px;border-radius:8px;font-size:13px
}

#typing{font-size:13px;color:#666;padding:5px 10px;height:18px}

#inputBox{display:flex;flex-direction:column;padding:10px;background:#fff}
#sendRow{display:flex;gap:5px}
input,select{flex:1;padding:10px;font-size:16px}
button{padding:10px}

#loginBox{text-align:center;padding:30px}
</style>
</head>

<body>

<header>
  💬 UChat
  <button id="logout" onclick="logout()">Đăng xuất</button>
</header>

<div id="loginBox">
  <input id="username" placeholder="Nhập tên của bạn"><br><br>
  <select id="gender">
    <option value="">-- Chọn giới tính --</option>
    <option value="male">👦 Nam</option>
    <option value="female">👧 Nữ</option>
  </select><br><br>
  <button onclick="doLogin()">Vào chat</button>
</div>

<div id="chat" style="display:none"></div>
<div id="typing"></div>

<!-- REPLY BOX -->
<div id="replyBox">
  <b>Đang trả lời:</b>
  <span style="float:right;color:red;cursor:pointer;font-weight:bold"
        onclick="cancelReply()">❌</span>
  <div id="replyText"></div>
</div>

<div id="inputBox" style="display:none">
  <div id="sendRow">
    <input id="text" placeholder="Nhập tin nhắn...">
    <button onclick="send()">Gửi</button>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCxxxxxxxxxxxx",
  authDomain:"uchat-406f4.firebaseapp.com",
  databaseURL:"https://uchat-406f4-default-rtdb.firebaseio.com",
  projectId:"uchat-406f4"
});

const db=firebase.database().ref("uchat");
const typingRef=firebase.database().ref("typing");

const chat=document.getElementById("chat");
const loginBox=document.getElementById("loginBox");
const inputBox=document.getElementById("inputBox");
const textInput=document.getElementById("text");
const typing=document.getElementById("typing");
const replyBox=document.getElementById("replyBox");
const replyText=document.getElementById("replyText");

let user="", gender="", replyData=null;

/* AUTO LOGIN */
const su=localStorage.getItem("uchat_user");
const sg=localStorage.getItem("uchat_gender");
if(su&&sg){
  user=su; gender=sg;
  loginBox.style.display="none";
  chat.style.display="block";
  inputBox.style.display="flex";
}

/* LOGIN */
function doLogin(){
  const name=username.value.trim();
  const g=gender.value;
  if(!name||!g) return alert("Nhập đủ thông tin!");
  user=name; gender=g;
  localStorage.setItem("uchat_user",user);
  localStorage.setItem("uchat_gender",gender);
  loginBox.style.display="none";
  chat.style.display="block";
  inputBox.style.display="flex";
}

/* LOGOUT */
function logout(){
  localStorage.clear();
  location.reload();
}

/* SEND */
function send(){
  const text=textInput.value.trim();
  if(!text) return;
  db.push({name:user,gender,msg:text,reply:replyData,time:Date.now()});
  replyData=null;
  replyBox.style.display="none";
  textInput.value="";
}

/* CANCEL REPLY */
function cancelReply(){
  replyData=null;
  replyBox.style.display="none";
}

/* RECEIVE */
db.on("child_added",snap=>{
  const d=snap.val();
  const isMe=d.name===user;

  const row=document.createElement("div");
  row.className="msgRow "+(isMe?"meRow":"");

  const avatar=document.createElement("div");
  avatar.className="avatar "+(d.gender==="female"?"female":"male");
  avatar.innerText=d.name[0].toUpperCase();

  const msg=document.createElement("div");
  msg.className="msg "+(isMe?"me":"");

  let replyHTML="";
  if(d.reply){
    replyHTML=`<div class="replyPreview">${d.reply.name}: ${d.reply.msg}</div>`;
  }

  msg.innerHTML=`
    ${replyHTML}
    <div class="name">${d.name}</div>
    <div class="content">${d.msg}</div>
    <div class="time">${new Date(d.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
    <div class="replyBtn">↩ Trả lời</div>
  `;

  msg.querySelector(".replyBtn").onclick=()=>{
    replyData={name:d.name,msg:d.msg};
    replyText.innerText=d.name+": "+d.msg;
    replyBox.style.display="block";
  };

  row.appendChild(isMe?msg:avatar);
  row.appendChild(isMe?avatar:msg);
  chat.appendChild(row);
  chat.scrollTop=chat.scrollHeight;
});

/* TYPING */
textInput.addEventListener("input",()=>{
  typingRef.child(user).set(true);
  setTimeout(()=>typingRef.child(user).remove(),1200);
});
typingRef.on("value",snap=>{
  const o=Object.keys(snap.val()||{}).filter(n=>n!==user);
  typing.innerText=o.length?o.join(", ")+" đang gõ...":"";
});
</script>

</body>
</html>
