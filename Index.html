<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat - Ứng dụng nhắn tin học tập</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
}
header {
  background: #4a90e2;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}
#chat {
  height: calc(100vh - 140px);
  overflow-y: auto;
  padding: 10px;
}
.msg {
  background: white;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
}
.name {
  font-weight: bold;
  color: #4a90e2;
}
.msg img {
  max-width: 100%;
  border-radius: 8px;
  margin-top: 5px;
}
#input {
  display: flex;
  gap: 5px;
  padding: 10px;
  background: white;
}
input[type="text"] {
  flex: 1;
  padding: 10px;
  font-size: 16px;
}
button {
  padding: 10px 15px;
  font-size: 16px;
}
#login {
  padding: 20px;
  text-align: center;
}
</style>
</head>

<body>

<header>💬 UChat</header>

<!-- LOGIN -->
<div id="login">
  <input id="username" placeholder="Nhập tên của bạn" />
  <br><br>
  <button onclick="login()">Vào chat</button>
</div>

<!-- CHAT -->
<div id="chat" style="display:none"></div>

<!-- INPUT -->
<div id="input" style="display:none">
  <input type="file" id="img" accept="image/*">
  <input id="text" placeholder="Nhập tin nhắn..." />
  <button onclick="send()">Gửi</button>
</div>

<script>
/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCxxxxxxxxxxxxxxxxxxxx",
  authDomain: "uchat-406f4.firebaseapp.com",
  databaseURL: "https://uchat-406f4-default-rtdb.firebaseio.com/",
  projectId: "uchat-406f4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("uchat");
const storage = firebase.storage();

let user = "";

/* ===== LOGIN ===== */
function login() {
  const name = document.getElementById("username").value.trim();
  if (!name) return alert("Nhập tên trước đã!");
  user = name;
  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "block";
  document.getElementById("input").style.display = "flex";
}

/* ===== SEND MESSAGE / IMAGE ===== */
function send() {
  const text = document.getElementById("text").value.trim();
  const file = document.getElementById("img").files[0];

  if (file) {
    const ref = storage.ref("images/" + Date.now() + "_" + file.name);
    ref.put(file).then(() => {
      ref.getDownloadURL().then(url => {
        db.push({
          name: user,
          msg: text || "",
          image: url,
          time: Date.now()
        });
      });
    });
  } else if (text) {
    db.push({
      name: user,
      msg: text,
      time: Date.now()
    });
  }

  document.getElementById("text").value = "";
  document.getElementById("img").value = "";
}

/* ===== RECEIVE MESSAGE ===== */
db.on("child_added", snap => {
  const data = snap.val();
  const div = document.createElement("div");
  div.className = "msg";

  div.innerHTML = `
    <div class="name">${data.name}</div>
    ${data.msg ? `<div>${data.msg}</div>` : ""}
    ${data.image ? `<img src="${data.image}">` : ""}
  `;

  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop =
    document.getElementById("chat").scrollHeight;
});
</script>

</body>
</html>
