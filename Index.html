<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f2f2f2;
}

header{
  background:#4a90e2;
  color:#fff;
  padding:14px;
  text-align:center;
  font-size:20px;
}

/* CHAT */
#chat{
  padding:10px;
  height:calc(100vh - 140px);
  overflow-y:auto;
}

/* TIN NHẮN */
.msg{
  display:inline-block;
  max-width:75%;
  background:#fff;
  padding:10px 12px;
  margin:6px 0;
  border-radius:14px;

  /* 🔥 SỬA LỖI CHỮ DÀI */
  word-break: break-word;
  overflow-wrap: anywhere;
  white-space: pre-wrap;

  position:relative;
  clear:both;
}

/* TIN CỦA MÌNH */
.me{
  background:#d9ecff;
  float:right;
  text-align:left;
}

/* TIN NGƯỜI KHÁC */
.other{
  float:left;
}

/* TÊN + GIỜ */
.name{
  font-weight:bold;
  color:#4a90e2;
  font-size:13px;
  margin-bottom:4px;
}
.time{
  font-size:11px;
  color:#888;
  margin-top:4px;
  text-align:right;
}

/* NÚT XÓA */
.delete{
  position:absolute;
  top:6px;
  right:8px;
  font-size:14px;
  color:red;
  cursor:pointer;
}

/* INPUT */
#input{
  display:flex;
  gap:6px;
  padding:10px;
  background:#fff;
}
#input input{
  flex:1;
  padding:10px;
  font-size:16px;
}
#input button{
  padding:10px 14px;
}

/* LOGIN */
#login{
  padding:20px;
  text-align:center;
}
</style>
</head>

<body>

<header>💬 UChat</header>

<!-- LOGIN -->
<div id="login">
  <input id="username" placeholder="Nhập tên của bạn">
  <br><br>
  <button onclick="login()">Vào chat</button>
</div>

<!-- CHAT -->
<div id="chat" style="display:none"></div>

<!-- INPUT -->
<div id="input" style="display:none">
  <input id="text" placeholder="Nhập tin nhắn...">
  <button onclick="send()">Gửi</button>
</div>

<script>
/* ===== FIREBASE ===== */
const firebaseConfig={
  apiKey:"AIzaSyCxxxxxxxxxxxxxxxxxxxx",
  authDomain:"uchat-406f4.firebaseapp.com",
  databaseURL:"https://uchat-406f4-default-rtdb.firebaseio.com",
  projectId:"uchat-406f4"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database().ref("uchat");

/* ===== USER ===== */
let user="";
const chat=document.getElementById("chat");

/* TỰ ĐĂNG NHẬP */
const saved=localStorage.getItem("uchat_name");
if(saved){
  user=saved;
  showChat();
}

/* LOGIN */
function login(){
  const name=document.getElementById("username").value.trim();
  if(!name) return alert("Nhập tên!");
  user=name;
  localStorage.setItem("uchat_name",name);
  showChat();
}

function showChat(){
  document.getElementById("login").style.display="none";
  chat.style.display="block";
  document.getElementById("input").style.display="flex";
}

/* GỬI TIN */
function send(){
  const text=document.getElementById("text").value.trim();
  if(!text) return;
  db.push({name:user,msg:text,time:Date.now()});
  document.getElementById("text").value="";
}

/* ĐỊNH DẠNG GIỜ */
function timeFormat(t){
  const d=new Date(t);
  return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
}

/* XÓA TIN */
function deleteMsg(id){
  if(confirm("Xóa tin nhắn?")){
    db.child(id).remove();
  }
}

/* NHẬN TIN */
db.on("child_added",snap=>{
  const d=snap.val();
  const id=snap.key;
  const isMe=d.name===user;

  const div=document.createElement("div");
  div.className="msg "+(isMe?"me":"other");
  div.id=id;

  div.innerHTML=`
    <div class="name">${d.name}</div>
    <div>${d.msg}</div>
    <div class="time">${timeFormat(d.time)}</div>
    ${isMe?`<div class="delete" onclick="deleteMsg('${id}')">🗑</div>`:""}
  `;

  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
});

/* KHI BỊ XÓA */
db.on("child_removed",snap=>{
  const el=document.getElementById(snap.key);
  if(el) el.remove();
});
</script>

</body>
</html>
