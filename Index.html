<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
header{background:#4a90e2;color:#fff;padding:15px;text-align:center;font-size:20px}
#chat{height:calc(100vh - 170px);overflow-y:auto;padding:10px}

.msg{
  background:#fff;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  max-width:75%;
  position:relative;
}
.msg .content{
  white-space:pre-wrap;
  word-break:break-word;
}
.me{background:#d9ecff;margin-left:auto;text-align:right}
.name{font-weight:bold;color:#4a90e2}
.time{font-size:11px;color:#888}
.delete{color:red;cursor:pointer;font-size:12px}

.reactions{
  display:flex;
  gap:8px;
  font-size:18px;
  margin-top:5px;
}
.reactions span{cursor:pointer;opacity:.4}
.reactions span.active{opacity:1}

.picker{
  position:absolute;
  bottom:40px;
  left:10px;
  background:#fff;
  border-radius:20px;
  padding:6px 10px;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
  display:none;
  z-index:10;
}
.picker span{font-size:20px;margin:0 4px;cursor:pointer}

#typing{font-size:13px;color:#666;padding:5px 10px;height:20px}
#inputBox{display:flex;gap:5px;padding:10px;background:#fff}
input{flex:1;padding:10px;font-size:16px}
button{padding:10px 15px}
#loginBox{text-align:center;padding:20px}
</style>
</head>

<body>

<header>💬 UChat</header>

<div id="loginBox">
  <input id="username" placeholder="Nhập tên của bạn">
  <br><br>
  <button onclick="doLogin()">Vào chat</button>
</div>

<div id="chat" style="display:none"></div>
<div id="typing"></div>

<div id="inputBox" style="display:none">
  <input id="text" placeholder="Nhập tin nhắn...">
  <button onclick="send()">Gửi</button>
</div>

<audio id="notifySound">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-message-pop-alert-2354.mp3">
</audio>

<script>
/* ===== FIREBASE ===== */
const firebaseConfig={
  apiKey:"AIzaSyCxxxxxxxxxxxxxxxxxxxx",
  authDomain:"uchat-406f4.firebaseapp.com",
  databaseURL:"https://uchat-406f4-default-rtdb.firebaseio.com",
  projectId:"uchat-406f4"
};
firebase.initializeApp(firebaseConfig);

const db=firebase.database().ref("uchat");
const typingRef=firebase.database().ref("typing");

/* ===== DOM ===== */
const chat=document.getElementById("chat");
const loginBox=document.getElementById("loginBox");
const inputBox=document.getElementById("inputBox");
const typing=document.getElementById("typing");
const notifySound=document.getElementById("notifySound");
const textInput=document.getElementById("text");

let user="";
let firstLoad=true;
const EMOJIS=["👍","😂","😮","😡","❤️"];

/* ===== AUTO LOGIN ===== */
const saved=localStorage.getItem("uchat_name");
if(saved){user=saved;showChat();}

function doLogin(){
  const name=document.getElementById("username").value.trim();
  if(!name) return alert("Nhập tên!");
  user=name;
  localStorage.setItem("uchat_name",name);
  showChat();
}

function showChat(){
  loginBox.style.display="none";
  chat.style.display="block";
  inputBox.style.display="flex";
}

/* ===== XUỐNG DÒNG THEO TỪ ~28 KÝ TỰ ===== */
function wrap28Words(text){
  const words = text.split(" ");
  let line = "";
  let result = "";

  words.forEach(w=>{
    if((line + w).length > 28){
      result += line.trim() + "\n";
      line = w + " ";
    }else{
      line += w + " ";
    }
  });

  return (result + line).trim();
}

function send(){
  let text=textInput.value.trim();
  if(!text) return;

  text = wrap28Words(text); // 👈 28 ký tự, không cắt chữ

  db.push({
    name:user,
    msg:text,
    time:Date.now(),
    react:{}
  });

  textInput.value="";
  typingRef.child(user).remove();
}

function timeFormat(t){
  const d=new Date(t);
  return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
}

function toggleReact(id,emoji){
  const ref=db.child(id).child("react").child(emoji).child(user);
  ref.once("value",s=>{
    if(s.exists()) ref.remove();
    else ref.set(true);
  });
}

/* ===== RECEIVE ===== */
db.on("child_added",snap=>{
  const d=snap.val();
  const key=snap.key;
  const isMe=d.name===user;

  const div=document.createElement("div");
  div.className="msg "+(isMe?"me":"");
  div.id=key;

  const picker=document.createElement("div");
  picker.className="picker";
  EMOJIS.forEach(e=>{
    const s=document.createElement("span");
    s.innerText=e;
    s.onclick=()=>toggleReact(key,e);
    picker.appendChild(s);
  });

  div.innerHTML=`
    <div class="name">${d.name}</div>
    <div class="content">${d.msg}</div>
    <div class="time">${timeFormat(d.time)}</div>
    ${isMe?`<div class="delete" onclick="db.child('${key}').remove()">🗑️</div>`:""}
    <div class="reactions"></div>
  `;

  div.appendChild(picker);
  div.onclick=()=>picker.style.display=
    picker.style.display==="block"?"none":"block";

  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;

  if(!firstLoad && !isMe) notifySound.play();
  firstLoad=false;
});

/* ===== UPDATE REACTION ===== */
db.on("child_changed",snap=>{
  const d=snap.val();
  const div=document.getElementById(snap.key);
  if(!div) return;

  const box=div.querySelector(".reactions");
  box.innerHTML="";
  if(!d.react) return;

  for(const e in d.react){
    const count=Object.keys(d.react[e]).length;
    const span=document.createElement("span");
    span.innerText=`${e} ${count}`;
    if(d.react[e][user]) span.classList.add("active");
    box.appendChild(span);
  }
});

db.on("child_removed",snap=>{
  document.getElementById(snap.key)?.remove();
});

/* ===== TYPING ===== */
let typingTimer;
textInput.addEventListener("input",()=>{
  typingRef.child(user).set(true);
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>typingRef.child(user).remove(),1200);
});

typingRef.on("value",snap=>{
  const data=snap.val()||{};
  const others=Object.keys(data).filter(n=>n!==user);
  typing.innerText=others.length?others.join(", ")+" đang gõ...":"";
});
</script>

</body>
</html>
