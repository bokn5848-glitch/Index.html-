<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
header{background:#4a90e2;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}
#logout{background:#ff4d4d;color:#fff;border:none;padding:6px 10px;border-radius:6px}

#chat{height:calc(100vh - 280px);overflow-y:auto;padding:10px}

.msgRow{display:flex;align-items:flex-start;gap:8px;margin:6px 0}
.meRow{flex-direction:row-reverse}

.avatar{
  width:34px;height:34px;border-radius:50%;
  background:#4a90e2;color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;flex-shrink:0;overflow:hidden
}
.avatar img{width:100%;height:100%;object-fit:cover}

.msg{
  background:#fff;padding:8px 10px;border-radius:14px;
  max-width:70%;width:fit-content;word-wrap:break-word
}
.me{background:#d9ecff}

.name{font-weight:bold;color:#4a90e2;font-size:13px}
.content{white-space:pre-wrap}
.time{font-size:11px;color:#888;text-align:right}

.replyBtn{font-size:12px;color:#4a90e2;cursor:pointer;text-align:right}
.delete{font-size:12px;color:red;cursor:pointer;text-align:right}
.status{font-size:11px;color:#4a90e2;text-align:right}

.replyPreview{
  font-size:13px;background:#f1f1f1;
  padding:5px 8px;border-radius:8px;margin-bottom:4px
}

#typing{font-size:13px;color:#666;padding:5px 10px;height:18px}

#inputBox{display:flex;flex-direction:column;padding:10px;background:#fff}
#sendRow{display:flex;gap:5px}
input{flex:1;padding:10px;font-size:16px}
button{padding:10px}

.replyBox{
  background:#eef6ff;padding:6px 10px;
  border-left:4px solid #4a90e2;
  margin-bottom:6px;font-size:14px;position:relative
}
.replyBox .close{position:absolute;right:6px;top:4px;cursor:pointer;color:red}

#loginBox{text-align:center;padding:30px}
</style>
</head>

<body>

<header>
  💬 UChat
  <button id="logout" onclick="logout()">Đăng xuất</button>
</header>

<div id="loginBox">
  <input id="username" placeholder="Nhập tên của bạn"><br><br>
  <input type="file" id="avatarFile" accept="image/*"><br><br>
  <button onclick="doLogin()">Vào chat</button>
</div>

<div id="chat" style="display:none"></div>
<div id="typing"></div>

<div id="inputBox" style="display:none">
  <div id="replyArea"></div>
  <div id="sendRow">
    <input id="text" placeholder="Nhập tin nhắn...">
    <button onclick="send()">Gửi</button>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCxxxxxxxxxxxx",
  authDomain:"uchat-406f4.firebaseapp.com",
  databaseURL:"https://uchat-406f4-default-rtdb.firebaseio.com",
  projectId:"uchat-406f4"
});

const db = firebase.database().ref("uchat");
const typingRef = firebase.database().ref("typing");
const storage = firebase.storage();

const chat=document.getElementById("chat");
const textInput=document.getElementById("text");
const replyArea=document.getElementById("replyArea");
const typing=document.getElementById("typing");

let user="", avatar="", replyTo=null;

const saved=localStorage.getItem("uchat_name");
if(saved){
  user=saved;
  avatar=localStorage.getItem("uchat_avatar")||"";
  showChat();
}

function doLogin(){
  const n=username.value.trim();
  const file=avatarFile.files[0];
  if(!n) return alert("Nhập tên!");

  user=n;
  localStorage.setItem("uchat_name",n);

  if(file){
    const ref=storage.ref("avatars/"+n);
    ref.put(file).then(()=>{
      ref.getDownloadURL().then(url=>{
        avatar=url;
        localStorage.setItem("uchat_avatar",url);
        showChat();
      });
    });
  }else{
    avatar="";
    showChat();
  }
}

function showChat(){
  loginBox.style.display="none";
  chat.style.display="block";
  inputBox.style.display="flex";
}

function logout(){
  if(!confirm("Đăng xuất / đổi tên?"))return;
  localStorage.clear();
  user="";chat.innerHTML="";
  loginBox.style.display="block";
  chat.style.display="none";
  inputBox.style.display="none";
}

function wrap28(t){
  let o="";for(let i=0;i<t.length;i+=28)o+=t.slice(i,i+28)+"\n";
  return o.trim();
}

function send(){
  const t=textInput.value.trim();
  if(!t) return;
  db.push({
    name:user,
    avatar:avatar,
    msg:wrap28(t),
    time:Date.now(),
    reply:replyTo
  });
  textInput.value="";
  replyTo=null;
  replyArea.innerHTML="";
}

const tf=t=>{
  const d=new Date(t);
  return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
};

db.on("child_added",snap=>{
  const d=snap.val(),k=snap.key,isMe=d.name===user;
  const row=document.createElement("div");
  row.className="msgRow "+(isMe?"meRow":"");

  const av=d.avatar
    ? `<div class="avatar"><img src="${d.avatar}"></div>`
    : `<div class="avatar">${d.name.charAt(0)}</div>`;

  let replyHTML="";
  if(d.reply) replyHTML=`<div class="replyPreview"><b>${d.reply.name}</b>: ${d.reply.msg}</div>`;

  row.innerHTML=`
    ${av}
    <div class="msg ${isMe?"me":""}" id="${k}">
      <div class="name">${d.name}</div>
      ${replyHTML}
      <div class="content">${d.msg}</div>
      <div class="time">${tf(d.time)}</div>
      <div class="replyBtn" onclick="setReply('${k}')">↩️ Trả lời</div>
      ${isMe?`<div class="delete" onclick="db.child('${k}').remove()">🗑️</div>`:""}
    </div>
  `;
  chat.appendChild(row);
  chat.scrollTop=chat.scrollHeight;
});

function setReply(id){
  const m=document.getElementById(id);
  replyTo={name:m.querySelector(".name").innerText,msg:m.querySelector(".content").innerText};
  replyArea.innerHTML=`<div class="replyBox">Trả lời <b>${replyTo.name}</b>: ${replyTo.msg}<span class="close" onclick="cancelReply()">✖</span></div>`;
}
function cancelReply(){replyTo=null;replyArea.innerHTML="";}

let tmr;
textInput.oninput=()=>{
  typingRef.child(user).set(true);
  clearTimeout(tmr);
  tmr=setTimeout(()=>typingRef.child(user).remove(),1200);
};
typingRef.on("value",s=>{
  const o=Object.keys(s.val()||{}).filter(n=>n!==user);
  typing.innerText=o.length?o.join(", ")+" đang gõ...":"";
});
</script>

</body>
</html>
