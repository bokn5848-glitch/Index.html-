<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:#e5efff;
  height:100vh;
  display:flex;
  flex-direction:column
}

/* HEADER */
header{
  height:54px;
  background:#1976ff;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  font-weight:600
}
#logout{background:none;border:none;color:#fff;font-size:14px}

/* CHAT */
#chat{
  flex:1;
  overflow-y:auto;
  padding:12px;
}

/* MESSAGE */
.msg{
  max-width:78%;
  margin-bottom:10px;
  display:flex;
  gap:8px;
}
.me{margin-left:auto;flex-direction:row-reverse}

.avatar{
  width:36px;height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:600;
  font-size:14px
}
.male{background:#1976ff}
.female{background:#ff5ca2}
.other{background:#888}

.bubble{
  background:#fff;
  padding:10px 12px;
  border-radius:18px;
  box-shadow:0 1px 3px rgba(0,0,0,.1);
  position:relative
}
.me .bubble{
  background:#d9ecff;
  border-bottom-right-radius:4px
}
.otherMsg .bubble{
  border-bottom-left-radius:4px
}

.name{
  font-size:12px;
  font-weight:600;
  margin-bottom:2px;
  color:#1976ff
}

.replyPreview{
  font-size:12px;
  background:#f0f4ff;
  border-left:3px solid #1976ff;
  padding:4px 6px;
  margin-bottom:4px
}

.content{white-space:pre-wrap;font-size:15px}

.time{
  font-size:11px;
  color:#888;
  text-align:right;
  margin-top:2px
}

.status{
  font-size:11px;
  color:#1976ff;
  text-align:right;
  cursor:pointer
}

.replyBtn,.delete{
  font-size:12px;
  color:#1976ff;
  cursor:pointer;
  text-align:right
}
.delete{color:red}

/* INPUT */
#typing{
  font-size:12px;
  color:#555;
  padding:4px 12px
}

#inputBox{
  padding:8px;
  background:#fff;
  border-top:1px solid #ddd
}
#replyBox{
  background:#eef4ff;
  border-left:4px solid #1976ff;
  padding:6px 8px;
  margin-bottom:6px;
  font-size:13px;
  position:relative
}
#replyBox .close{
  position:absolute;
  right:6px;top:4px;
  cursor:pointer;
  color:red
}
#sendRow{
  display:flex;
  gap:6px
}
#text{
  flex:1;
  padding:10px 12px;
  border-radius:20px;
  border:1px solid #ccc;
  font-size:15px
}
#sendRow button{
  background:#1976ff;
  color:#fff;
  border:none;
  border-radius:50%;
  width:42px;height:42px;
  font-size:16px
}

/* LOGIN */
#loginBox{
  padding:40px 20px;
  text-align:center
}
input,select{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  font-size:16px
}
</style>
</head>

<body>

<header>
  💬 UChat
  <button id="logout" onclick="logout()">Đăng xuất</button>
</header>

<div id="loginBox">
  <input id="username" placeholder="Tên của bạn">
  <select id="genderSelect">
    <option value="">Giới tính</option>
    <option value="male">Nam</option>
    <option value="female">Nữ</option>
    <option value="other">Khác</option>
  </select>
  <button onclick="doLogin()">Vào chat</button>
</div>

<div id="chat" style="display:none"></div>
<div id="typing"></div>

<div id="inputBox" style="display:none">
  <div id="replyArea"></div>
  <div id="sendRow">
    <input id="text" placeholder="Nhắn tin…">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCxxxxxxxxxxxx",
  authDomain:"uchat-406f4.firebaseapp.com",
  databaseURL:"https://uchat-406f4-default-rtdb.firebaseio.com",
  projectId:"uchat-406f4"
});

const db=firebase.database().ref("uchat");
const typingRef=firebase.database().ref("typing");

let userName="",userGender="",replyTo=null;

if(localStorage.uchat_name&&localStorage.uchat_gender){
  userName=localStorage.uchat_name;
  userGender=localStorage.uchat_gender;
  showChat();
}

function doLogin(){
  const n=username.value.trim();
  const g=genderSelect.value;
  if(!n||!g) return alert("Nhập đủ thông tin");
  userName=n;userGender=g;
  localStorage.uchat_name=n;
  localStorage.uchat_gender=g;
  showChat();
}

function showChat(){
  loginBox.style.display="none";
  chat.style.display="block";
  inputBox.style.display="block";
}

function logout(){
  localStorage.clear();
  location.reload();
}

function send(){
  if(!text.value.trim())return;
  db.push({
    name:userName,
    gender:userGender,
    msg:text.value,
    reply:replyTo,
    time:Date.now(),
    seen:{}
  });
  text.value="";
  replyTo=null;
  replyArea.innerHTML="";
  typingRef.child(userName).remove();
}

db.on("child_added",s=>{
  const d=s.val(),k=s.key,isMe=d.name===userName;
  const div=document.createElement("div");
  div.className="msg "+(isMe?"me":"otherMsg");
  div.id=k;

  div.innerHTML=`
    <div class="avatar ${d.gender}">${d.name[0]}</div>
    <div class="bubble">
      <div class="name">${d.name}</div>
      ${d.reply?`<div class="replyPreview"><b>${d.reply.name}</b>: ${d.reply.msg}</div>`:""}
      <div class="content">${d.msg}</div>
      <div class="time">${new Date(d.time).toLocaleTimeString().slice(0,5)}</div>
      ${isMe?`<div class="status" id="st_${k}">✔️</div>`:""}
      <div class="replyBtn" onclick="setReply('${k}')">Trả lời</div>
      ${isMe?`<div class="delete" onclick="db.child('${k}').remove()">Xóa</div>`:""}
    </div>
  `;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
});
</script>

</body>
</html>
