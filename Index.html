<script>
const firebaseConfig = {
  apiKey: "AIzaSyCxxxxxxxxxxxxxxxxxxxx",
  authDomain: "uchat-406f4.firebaseapp.com",
  databaseURL: "https://uchat-406f4-default-rtdb.firebaseio.com/",
  projectId: "uchat-406f4"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database().ref("uchat");
const storage = firebase.storage();

let user = "";

// LOGIN
function login() {
  const name = document.getElementById("username").value.trim();
  if (!name) return alert("Nhập tên trước đã!");
  user = name;
  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "block";
  document.getElementById("input").style.display = "flex";
}

// SEND (ĐÃ GẮN FIX)
function send() {
  const textEl = document.getElementById("text");
  const imgEl = document.getElementById("img");

  const text = textEl.value.trim();
  const file = imgEl.files[0];

  // không có gì để gửi
  if (!text && !file) {
    alert("Chưa nhập tin nhắn hoặc chọn ảnh");
    return;
  }

  // GỬI ẢNH
  if (file) {
    console.log("Đang upload ảnh:", file.name);

    const ref = storage.ref("images/" + Date.now() + "_" + file.name);

    ref.put(file)
      .then(() => ref.getDownloadURL())
      .then(url => {
        console.log("Upload ảnh OK:", url);

        db.push({
          name: user,
          msg: text || "",
          image: url,
          time: Date.now()
        });
      })
      .catch(err => {
        console.error("LỖI UPLOAD ẢNH:", err);
        alert(
          "Không gửi được ảnh ❌\n" +
          "Lý do thường gặp:\n" +
          "• Chưa bật Firebase Storage\n" +
          "• Storage Rules bị chặn\n" +
          "• Chạy bằng file://\n\n" +
          "Tin nhắn chữ vẫn sẽ được gửi."
        );

        // fallback: gửi chữ nếu có
        if (text) {
          db.push({
            name: user,
            msg: text,
            time: Date.now()
          });
        }
      });
  }
  // CHỈ GỬI CHỮ
  else {
    db.push({
      name: user,
      msg: text,
      time: Date.now()
    });
  }

  textEl.value = "";
  imgEl.value = "";
}

// RECEIVE
db.on("child_added", snap => {
  const data = snap.val();
  const div = document.createElement("div");
  div.className = "msg";

  div.innerHTML = `
    <div class="name">${data.name}</div>
    ${data.msg ? `<div>${data.msg}</div>` : ""}
    ${data.image ? `<img src="${data.image}">` : ""}
  `;

  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop =
    document.getElementById("chat").scrollHeight;
});
          </script>
