<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
header{background:#4a90e2;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}
#logout{background:#ff4d4d;color:#fff;border:none;padding:6px 10px;border-radius:6px}
#chat{height:calc(100vh - 230px);overflow-y:auto;padding:10px}
.msg{background:#fff;padding:8px 10px;margin:6px 0;border-radius:14px;max-width:70%;width:fit-content;position:relative}
.me{background:#d9ecff;margin-left:auto}
.name{font-weight:bold;color:#4a90e2;font-size:13px}
.content{white-space:pre-wrap}
.time{font-size:11px;color:#888;text-align:right}
.status{font-size:11px;color:#4a90e2;text-align:right;cursor:pointer}
.delete,.replyBtn{font-size:12px;cursor:pointer;text-align:right}
.delete{color:red}
.replyBtn{color:#4a90e2}

.reactionBar{position:absolute;bottom:100%;left:10px;background:#fff;padding:6px 10px;border-radius:30px;box-shadow:0 4px 12px rgba(0,0,0,.25);display:none;gap:8px;z-index:999}
.reactionBar span{font-size:22px;cursor:pointer}
.reactionList{display:flex;gap:6px;font-size:16px;margin-top:4px}

.seenBox{position:absolute;right:0;bottom:100%;background:#fff;padding:8px 10px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.25);font-size:13px;display:none;z-index:999}

#typing{font-size:13px;color:#666;padding:5px 10px;height:18px}
#inputBox{display:flex;flex-direction:column;padding:10px;background:#fff}
#sendRow{display:flex;gap:5px}
input{flex:1;padding:10px;font-size:16px}
button{padding:10px}
.replyBox{background:#eef6ff;padding:6px 10px;border-left:4px solid #4a90e2;margin-bottom:6px;font-size:14px;position:relative}
.replyBox .close{position:absolute;right:6px;top:4px;cursor:pointer;color:red}
#loginBox{text-align:center;padding:30px}
</style>
</head>

<body>

<header>
  💬 UChat
  <button id="logout" onclick="logout()">Đăng xuất</button>
</header>

<div id="loginBox">
  <input id="username" placeholder="Nhập tên của bạn">
  <br><br>
  <button onclick="doLogin()">Vào chat</button>
</div>

<div id="chat" style="display:none"></div>
<div id="typing"></div>

<div id="inputBox" style="display:none">
  <div id="replyArea"></div>
  <div id="sendRow">
    <input id="text" placeholder="Nhập tin nhắn...">
    <button onclick="send()">Gửi</button>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCxxxxxxxxxxxx",
  authDomain:"uchat-406f4.firebaseapp.com",
  databaseURL:"https://uchat-406f4-default-rtdb.firebaseio.com",
  projectId:"uchat-406f4"
});

const db=firebase.database().ref("uchat");
const typingRef=firebase.database().ref("typing");
const REACTIONS=["❤️","😂","😮","😢","😡","👍"];

const chat=document.getElementById("chat");
const inputBox=document.getElementById("inputBox");
const loginBox=document.getElementById("loginBox");
const textInput=document.getElementById("text");
const replyArea=document.getElementById("replyArea");
const typing=document.getElementById("typing");

let user="",replyTo=null;

/* 🔥 TỰ ĐỘNG LOAD KHI ĐÃ ĐĂNG NHẬP */
window.onload=()=>{
  const saved=localStorage.getItem("uchat_name");
  if(saved){
    user=saved;
    showChat();
  }
};

function doLogin(){
  const n=username.value.trim();
  if(!n) return alert("Nhập tên!");
  user=n;
  localStorage.setItem("uchat_name",n);
  showChat();
}

function showChat(){
  loginBox.style.display="none";
  chat.style.display="block";
  inputBox.style.display="flex";
}

function logout(){
  if(!confirm("Đăng xuất / đổi tên?"))return;
  localStorage.removeItem("uchat_name");
  location.reload();
}

function send(){
  const t=textInput.value.trim();
  if(!t) return;
  db.push({name:user,msg:t,time:Date.now(),reply:replyTo,seen:{},react:{}});
  textInput.value="";
  replyTo=null;
  replyArea.innerHTML="";
}

const tf=t=>{const d=new Date(t);return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")};

function react(id,e){
  const r=db.child(id).child("react").child(e).child(user);
  r.once("value",s=>s.exists()?r.remove():r.set(true));
}

db.on("child_added",snap=>{
  const d=snap.val(),k=snap.key,isMe=d.name===user;
  const div=document.createElement("div");
  div.className="msg "+(isMe?"me":"");div.id=k;

  div.innerHTML=`
    <div class="reactionBar" id="react_${k}">
      ${REACTIONS.map(e=>`<span onclick="react('${k}','${e}')">${e}</span>`).join("")}
    </div>
    <div class="name">${d.name}</div>
    <div class="content">${d.msg}</div>
    <div class="reactionList" id="list_${k}"></div>
    <div class="time">${tf(d.time)}</div>
    ${isMe?`<div class="status">✔️</div>`:""}
    ${isMe?`<div class="delete" onclick="db.child('${k}').remove()">🗑️</div>`:""}
  `;

  div.oncontextmenu=e=>{
    e.preventDefault();
    document.querySelectorAll(".reactionBar").forEach(r=>r.style.display="none");
    document.getElementById("react_"+k).style.display="flex";
  };
  document.body.onclick=()=>document.querySelectorAll(".reactionBar").forEach(r=>r.style.display="none");

  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
});

db.on("child_changed",snap=>{
  const d=snap.val(),k=snap.key;
  const list=document.getElementById("list_"+k);
  if(list && d.react){
    list.innerHTML="";
    for(const e in d.react){
      const c=Object.keys(d.react[e]).length;
      if(c>0) list.innerHTML+=`<span>${e} ${c}</span>`;
    }
  }
});
</script>

</body>
</html>
