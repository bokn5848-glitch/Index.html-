<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body { margin:0; font-family:Arial; background:#f2f2f2; }
header { background:#4a90e2; color:#fff; padding:15px; text-align:center; font-size:20px; }
#chat { height:calc(100vh - 170px); overflow-y:auto; padding:10px; }

.msg { max-width:70%; padding:10px; margin:8px 0; border-radius:10px; word-wrap:break-word; }
.left { background:#fff; margin-right:auto; }
.right { background:#d2e9ff; margin-left:auto; text-align:right; }
.name { font-size:13px; font-weight:bold; color:#4a90e2; }

#typing { font-size:13px; color:#666; padding:5px 10px; height:20px; }

#input { display:flex; gap:5px; padding:10px; background:#fff; }
input { flex:1; padding:10px; font-size:16px; }
button { padding:10px 15px; font-size:16px; }

#login { padding:20px; text-align:center; }
</style>
</head>

<body>

<header>💬 UChat</header>

<div id="login">
  <input id="username" placeholder="Nhập tên của bạn" />
  <br><br>
  <button onclick="login()">Vào chat</button>
</div>

<div id="chat" style="display:none"></div>
<div id="typing"></div>

<div id="input" style="display:none">
  <input id="text" placeholder="Nhập tin nhắn..." />
  <button onclick="send()">Gửi</button>
</div>

<audio id="notifySound">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-message-pop-alert-2354.mp3" type="audio/mpeg">
</audio>

<script>
/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCxxxxxxxxxxxxxxxxxxxx",
  authDomain: "uchat-406f4.firebaseapp.com",
  databaseURL: "https://uchat-406f4-default-rtdb.firebaseio.com/",
  projectId: "uchat-406f4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("uchat");
const typingRef = firebase.database().ref("typing");

/* ===== USER ===== */
let user = "";

/* ===== AUTO LOGIN ===== */
const savedName = localStorage.getItem("uchat_name");
if (savedName) {
  user = savedName;
  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "block";
  document.getElementById("input").style.display = "flex";
}

/* ===== LOGIN ===== */
function login() {
  const name = document.getElementById("username").value.trim();
  if (!name) return alert("Nhập tên trước đã!");
  user = name;
  localStorage.setItem("uchat_name", name);

  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "block";
  document.getElementById("input").style.display = "flex";
}

/* ===== SEND ===== */
function send() {
  const text = document.getElementById("text").value.trim();
  if (!text) return;

  db.push({ name:user, msg:text, time:Date.now() });
  document.getElementById("text").value = "";
  typingRef.child(user).remove();
}

/* ===== RECEIVE + SOUND ===== */
let firstLoad = true;
db.on("child_added", snap => {
  const data = snap.val();
  const isMe = data.name === user;

  const div = document.createElement("div");
  div.className = "msg " + (isMe ? "right" : "left");
  div.innerHTML = `<div class="name">${data.name}</div><div>${data.msg}</div>`;
  document.getElementById("chat").appendChild(div);

  if (!firstLoad && !isMe) {
    document.getElementById("notifySound").play();
  }

  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
  firstLoad = false;
});

/* ===== ĐANG GÕ... ===== */
let typingTimeout;
const textInput = document.getElementById("text");

textInput.addEventListener("input", () => {
  if (!user) return;
  typingRef.child(user).set(true);
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    typingRef.child(user).remove();
  }, 1200);
});

typingRef.on("value", snap => {
  const data = snap.val() || {};
  const others = Object.keys(data).filter(n => n !== user);
  document.getElementById("typing").innerText =
    others.length ? others.join(", ") + " đang gõ..." : "";
});
</script>

</body>
</html>
