<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
header{
  background:#4a90e2;
  color:#fff;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
#logout{
  background:#ff4d4d;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:6px
}

#chat{
  height:calc(100vh - 240px);
  overflow-y:auto;
  padding:10px
}

.msgRow{
  display:flex;
  gap:8px;
  margin:6px 0;
  align-items:flex-start;
}
.meRow{justify-content:flex-end}

.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  color:#333;
  flex-shrink:0;
}
.male{background:#cfe9ff}
.female{background:#ffd6e7}

.msg{
  background:#fff;
  padding:8px 10px;
  border-radius:14px;
  max-width:70%;
  word-wrap:break-word;
}
.me{background:#d9ecff}

.name{font-weight:bold;color:#4a90e2;font-size:13px}
.content{white-space:pre-wrap}
.time{font-size:11px;color:#888;text-align:right}
.replyBtn,.delete{font-size:12px;cursor:pointer;text-align:right}
.replyBtn{color:#4a90e2}
.delete{color:red}

#typing{
  font-size:13px;
  color:#666;
  padding:5px 10px;
  height:18px
}

#inputBox{
  display:flex;
  flex-direction:column;
  padding:10px;
  background:#fff
}
#sendRow{display:flex;gap:5px}
input,select{flex:1;padding:10px;font-size:16px}
button{padding:10px}

#loginBox{
  text-align:center;
  padding:30px
}
</style>
</head>

<body>

<header>
  💬 UChat
  <button id="logout" onclick="logout()">Đăng xuất</button>
</header>

<!-- LOGIN -->
<div id="loginBox">
  <input id="username" placeholder="Nhập tên của bạn"><br><br>

  <select id="gender">
    <option value="">-- Chọn giới tính --</option>
    <option value="male">👦 Nam</option>
    <option value="female">👧 Nữ</option>
  </select><br><br>

  <button onclick="doLogin()">Vào chat</button>
</div>

<div id="chat" style="display:none"></div>
<div id="typing"></div>

<div id="inputBox" style="display:none">
  <div id="sendRow">
    <input id="text" placeholder="Nhập tin nhắn...">
    <button onclick="send()">Gửi</button>
  </div>
</div>

<script>
/* FIREBASE */
firebase.initializeApp({
  apiKey:"AIzaSyCxxxxxxxxxxxx",
  authDomain:"uchat-406f4.firebaseapp.com",
  databaseURL:"https://uchat-406f4-default-rtdb.firebaseio.com",
  projectId:"uchat-406f4"
});

const db=firebase.database().ref("uchat");
const typingRef=firebase.database().ref("typing");

const chat=document.getElementById("chat");
const loginBox=document.getElementById("loginBox");
const inputBox=document.getElementById("inputBox");
const textInput=document.getElementById("text");
const typing=document.getElementById("typing");

let user="";
let gender="";

/* AUTO LOGIN (CHỈ TÊN) */
if(localStorage.getItem("uchat_name")){
  user=localStorage.getItem("uchat_name");
  loginBox.style.display="block"; // bắt chọn lại giới tính
}

/* LOGIN */
function doLogin(){
  const name=document.getElementById("username").value.trim();
  const g=document.getElementById("gender").value;

  if(!name) return alert("Nhập tên!");
  if(!g) return alert("Chọn giới tính!");

  user=name;
  gender=g;

  localStorage.setItem("uchat_name",name);

  loginBox.style.display="none";
  chat.style.display="block";
  inputBox.style.display="flex";
}

/* LOGOUT */
function logout(){
  if(!confirm("Đăng xuất để đổi tên / giới tính?")) return;

  localStorage.removeItem("uchat_name");
  user="";
  gender="";

  chat.innerHTML="";
  loginBox.style.display="block";
  chat.style.display="none";
  inputBox.style.display="none";
}

/* SEND */
function send(){
  const text=textInput.value.trim();
  if(!text) return;

  db.push({
    name:user,
    gender:gender,
    msg:text,
    time:Date.now()
  });

  textInput.value="";
}

/* RECEIVE */
db.on("child_added",snap=>{
  const d=snap.val();
  const isMe=d.name===user;

  const row=document.createElement("div");
  row.className="msgRow "+(isMe?"meRow":"");

  const avatar=document.createElement("div");
  avatar.className="avatar "+(d.gender==="female"?"female":"male");
  avatar.innerText=d.name.charAt(0).toUpperCase();

  const msg=document.createElement("div");
  msg.className="msg "+(isMe?"me":"");
  msg.innerHTML=`
    <div class="name">${d.name}</div>
    <div class="content">${d.msg}</div>
    <div class="time">
      ${new Date(d.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
    </div>
  `;

  row.appendChild(avatar);
  row.appendChild(msg);
  chat.appendChild(row);
  chat.scrollTop=chat.scrollHeight;
});

/* TYPING */
textInput.addEventListener("input",()=>{
  typingRef.child(user).set(true);
  setTimeout(()=>typingRef.child(user).remove(),1200);
});
typingRef.on("value",snap=>{
  const d=snap.val()||{};
  const o=Object.keys(d).filter(n=>n!==user);
  typing.innerText=o.length?o.join(", ")+" đang gõ...":"";
});
</script>

</body>
</html>
