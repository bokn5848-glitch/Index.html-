<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
header{
  background:#4a90e2;color:#fff;padding:12px;
  display:flex;justify-content:space-between;align-items:center
}
#logout{background:#ff4d4d;color:#fff;border:none;padding:6px 10px;border-radius:6px}

#chat{height:calc(100vh - 250px);overflow-y:auto;padding:10px}

.msg{
  background:#fff;padding:8px 10px;margin:6px 0;
  border-radius:14px;max-width:70%;width:fit-content;
  position:relative;word-wrap:break-word
}
.me{background:#d9ecff;margin-left:auto}

.nameRow{display:flex;align-items:center;gap:6px}
.avatar{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:bold;font-size:14px
}
.male{background:#4a90e2}
.female{background:#ff6fa5}
.other{background:#888}

.name{font-weight:bold;font-size:13px}
.content{white-space:pre-wrap}
.time{font-size:11px;color:#888;text-align:right}

.delete{font-size:12px;color:red;cursor:pointer;text-align:right}

.confirmDelete{
  font-size:12px;margin-top:4px;color:#555;text-align:right
}
.confirmDelete span{
  cursor:pointer;margin-left:8px
}
.confirmDelete .yes{color:red}
.confirmDelete .no{color:#4a90e2}

#typing{font-size:13px;color:#666;padding:5px 10px;height:18px}
#inputBox{display:flex;padding:10px;background:#fff}
#inputBox input{flex:1;padding:10px;font-size:16px}
#inputBox button{padding:10px}

#loginBox{text-align:center;padding:30px}
select,input{padding:10px;font-size:16px;width:100%}
</style>
</head>

<body>

<header>
  💬 UChat
  <button id="logout" onclick="logout()">Đăng xuất</button>
</header>

<div id="loginBox">
  <input id="username" placeholder="Nhập tên"><br><br>
  <select id="gender">
    <option value="">-- Chọn giới tính --</option>
    <option value="male">Nam</option>
    <option value="female">Nữ</option>
    <option value="other">Khác</option>
  </select><br><br>
  <button onclick="doLogin()">Vào chat</button>
</div>

<div id="chat" style="display:none"></div>
<div id="typing"></div>

<div id="inputBox" style="display:none">
  <input id="text" placeholder="Nhập tin nhắn...">
  <button onclick="send()">Gửi</button>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCxxxxxxxxxxxx",
  authDomain:"uchat-406f4.firebaseapp.com",
  databaseURL:"https://uchat-406f4-default-rtdb.firebaseio.com",
  projectId:"uchat-406f4"
});

const db=firebase.database().ref("uchat");
const chat=document.getElementById("chat");
const textInput=document.getElementById("text");

let user="",gender="";

const savedName=localStorage.getItem("uchat_name");
const savedGender=localStorage.getItem("uchat_gender");
if(savedName && savedGender){
  user=savedName;gender=savedGender;showChat();
}

function doLogin(){
  const n=username.value.trim();
  const g=gender.value;
  if(!n||!g) return alert("Nhập tên & chọn giới tính");
  user=n;gender=g;
  localStorage.setItem("uchat_name",n);
  localStorage.setItem("uchat_gender",g);
  showChat();
}

function showChat(){
  loginBox.style.display="none";
  chat.style.display="block";
  inputBox.style.display="flex";
}

function logout(){
  if(!confirm("Đăng xuất / đổi tên?"))return;
  localStorage.clear();
  user="";gender="";
  chat.innerHTML="";
  loginBox.style.display="block";
  chat.style.display="none";
  inputBox.style.display="none";
}

function send(){
  const t=textInput.value.trim();
  if(!t) return;
  db.push({
    name:user,
    gender:gender,
    msg:t,
    time:Date.now()
  });
  textInput.value="";
}

const tf=t=>{
  const d=new Date(t);
  return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
};

db.on("child_added",snap=>{
  const d=snap.val(),k=snap.key,isMe=d.name===user;
  const div=document.createElement("div");
  div.className="msg "+(isMe?"me":"");
  div.id=k;

  const first=d.name.charAt(0).toUpperCase();

  div.innerHTML=`
    <div class="nameRow">
      <div class="avatar ${d.gender}">${first}</div>
      <div class="name">${d.name}</div>
    </div>
    <div class="content">${d.msg}</div>
    <div class="time">${tf(d.time)}</div>
    ${isMe?`
      <div class="delete" onclick="askDelete('${k}')">🗑️</div>
      <div class="confirmDelete" id="confirm_${k}" style="display:none">
        Xác nhận xóa?
        <span class="yes" onclick="confirmDelete('${k}')">Xóa</span>
        <span class="no" onclick="cancelDelete('${k}')">Hủy</span>
      </div>
    `:""}
  `;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
});

db.on("child_removed",s=>{
  document.getElementById(s.key)?.remove();
});

function askDelete(id){
  document.getElementById("confirm_"+id).style.display="block";
}
function cancelDelete(id){
  document.getElementById("confirm_"+id).style.display="none";
}
function confirmDelete(id){
  db.child(id).remove();
}
</script>

</body>
</html>
