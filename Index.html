<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat - Ứng dụng nhắn tin học tập</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
}
header {
  background: #4a90e2;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}
#chat {
  height: calc(100vh - 140px);
  overflow-y: auto;
  padding: 10px;
}
.msg {
  background: white;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  position: relative;
}
.name {
  font-weight: bold;
  color: #4a90e2;
}
.delete {
  position: absolute;
  top: 8px;
  right: 10px;
  cursor: pointer;
  color: red;
}
#input {
  display: flex;
  padding: 10px;
  background: white;
}
input {
  flex: 1;
  padding: 10px;
  font-size: 16px;
}
button {
  padding: 10px 15px;
  font-size: 16px;
}
#login {
  padding: 20px;
  text-align: center;
}
</style>
</head>

<body>

<header>💬 UChat</header>

<!-- LOGIN -->
<div id="login">
  <input id="username" placeholder="Nhập tên của bạn" />
  <br><br>
  <button onclick="login()">Vào chat</button>
</div>

<!-- CHAT -->
<div id="chat" style="display:none"></div>

<!-- INPUT -->
<div id="input" style="display:none">
  <input id="text" placeholder="Nhập tin nhắn..." />
  <button onclick="send()">Gửi</button>
</div>

<script>
/* ===== BIẾN CHUNG ===== */
let user = "";
let db = null;

/* ===== LOGIN (CHẮC CHẮN CHẠY) ===== */
function login() {
  const name = document.getElementById("username").value.trim();
  if (!name) {
    alert("Nhập tên trước đã!");
    return;
  }

  user = name;

  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "block";
  document.getElementById("input").style.display = "flex";
}

/* ===== FIREBASE (BỌC TRY/CATCH ĐỂ KHÔNG LÀM ĐỨNG WEB) ===== */
try {
  const firebaseConfig = {
    apiKey: "AIzaSyCxxxxxxxxxxxxxxxxxxxx",
    authDomain: "uchat-406f4.firebaseapp.com",
    databaseURL: "https://uchat-406f4-default-rtdb.firebaseio.com/",
    projectId: "uchat-406f4"
  };

  firebase.initializeApp(firebaseConfig);
  db = firebase.database().ref("uchat");

  // NHẬN TIN
  db.on("child_added", snap => {
    const data = snap.val();
    const key = snap.key;

    const div = document.createElement("div");
    div.className = "msg";
    div.id = key;

    div.innerHTML = `
      <div class="name">${data.name}</div>
      <div>${data.msg}</div>
      ${data.name === user ? `<div class="delete" onclick="del('${key}')">🗑️</div>` : ""}
    `;

    document.getElementById("chat").appendChild(div);
    document.getElementById("chat").scrollTop =
      document.getElementById("chat").scrollHeight;
  });

} catch (e) {
  console.error("Firebase lỗi:", e);
  alert("⚠️ Firebase chưa kết nối.\nBạn vẫn vào chat được nhưng chưa gửi tin.");
}

/* ===== SEND ===== */
function send() {
  const text = document.getElementById("text").value.trim();
  if (!text) return;

  if (!db) {
    alert("Firebase chưa kết nối!");
    return;
  }

  db.push({
    name: user,
    msg: text,
    time: Date.now()
  });

  document.getElementById("text").value = "";
}

/* ===== DELETE ===== */
function del(key) {
  if (!db) return;
  if (confirm("Xóa tin nhắn này?")) {
    db.child(key).remove();
    document.getElementById(key)?.remove();
  }
}
</script>

</body>
</html>
