<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
header{
  background:#4a90e2;color:#fff;padding:12px;
  display:flex;justify-content:space-between;align-items:center
}
#logout{background:#ff4d4d;color:#fff;border:none;padding:6px 10px;border-radius:6px}

#chat{height:calc(100vh - 260px);overflow-y:auto;padding:10px}

.msg{
  background:#fff;padding:8px 10px;margin:6px 0;
  border-radius:14px;max-width:70%;
  display:flex;gap:8px;position:relative
}
.me{margin-left:auto;background:#d9ecff}

.avatar{
  width:36px;height:36px;border-radius:50%;
  color:#fff;font-weight:bold;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0
}
.av-nam{background:#4a90e2}
.av-nu{background:#ff6fae}
.av-khac{background:#9b59b6}

.box{display:flex;flex-direction:column}
.name{font-weight:bold;color:#4a90e2;font-size:13px}
.content{white-space:pre-wrap}
.time{font-size:11px;color:#888;text-align:right}

.status{font-size:11px;color:#4a90e2;text-align:right}
.delete,.replyBtn{font-size:12px;color:#4a90e2;cursor:pointer;text-align:right}
.delete{color:red}

.replyPreview{
  font-size:13px;background:#f1f1f1;
  padding:5px 8px;border-radius:8px;margin-bottom:4px
}

/* REACTION */
.reactionBar{
  position:absolute;bottom:100%;left:50px;
  background:#fff;padding:6px 10px;border-radius:30px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  display:none;gap:8px;z-index:999
}
.reactionBar span{font-size:22px;cursor:pointer}
.reactionList{display:flex;gap:6px;font-size:16px;margin-top:4px}

.seenBox{
  position:absolute;right:0;bottom:100%;
  background:#fff;padding:8px 10px;border-radius:10px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  font-size:13px;display:none;z-index:999
}

#typing{font-size:13px;color:#666;padding:5px 10px;height:18px}

#inputBox{display:flex;flex-direction:column;padding:10px;background:#fff}
#sendRow{display:flex;gap:5px}
input,select{flex:1;padding:10px;font-size:16px}
button{padding:10px}

.replyBox{
  background:#eef6ff;padding:6px 10px;
  border-left:4px solid #4a90e2;
  margin-bottom:6px;font-size:14px;position:relative
}
.replyBox .close{
  position:absolute;right:6px;top:4px;cursor:pointer;color:red
}

#loginBox{text-align:center;padding:30px}
</style>
</head>

<body>

<header>
  💬 UChat
  <button id="logout" onclick="logout()">Đăng xuất</button>
</header>

<div id="loginBox">
  <input id="username" placeholder="Nhập tên của bạn"><br><br>
  <select id="gender">
    <option value="">-- Chọn giới tính --</option>
    <option value="nam">Nam</option>
    <option value="nu">Nữ</option>
    <option value="khac">Khác</option>
  </select><br><br>
  <button onclick="doLogin()">Vào chat</button>
</div>

<div id="chat" style="display:none"></div>
<div id="typing"></div>

<div id="inputBox" style="display:none">
  <div id="replyArea"></div>
  <div id="sendRow">
    <input id="text" placeholder="Nhập tin nhắn...">
    <button onclick="send()">Gửi</button>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCxxxxxxxxxxxx",
  authDomain:"uchat-406f4.firebaseapp.com",
  databaseURL:"https://uchat-406f4-default-rtdb.firebaseio.com",
  projectId:"uchat-406f4"
});

const db=firebase.database().ref("uchat");
const typingRef=firebase.database().ref("typing");
const REACTIONS=["❤️","😂","😮","😢","😡","👍"];

const chat=document.getElementById("chat");
const textInput=document.getElementById("text");
const replyArea=document.getElementById("replyArea");
const typing=document.getElementById("typing");

let user="",gender="",replyTo=null;

const nSaved=localStorage.getItem("uchat_name");
const gSaved=localStorage.getItem("uchat_gender");
if(nSaved && gSaved){user=nSaved;gender=gSaved;showChat();}

function doLogin(){
  const n=username.value.trim();
  const g=gender.value;
  if(!n||!g) return alert("Nhập tên và chọn giới tính!");
  user=n;gender=g;
  localStorage.setItem("uchat_name",n);
  localStorage.setItem("uchat_gender",g);
  showChat();
}
function showChat(){
  loginBox.style.display="none";
  chat.style.display="block";
  inputBox.style.display="flex";
}
function logout(){
  if(!confirm("Đăng xuất / đổi tên?"))return;
  localStorage.clear();
  chat.innerHTML="";
  loginBox.style.display="block";
  chat.style.display="none";
  inputBox.style.display="none";
}

function send(){
  const t=textInput.value.trim();
  if(!t) return;
  db.push({
    name:user,
    gender:gender,
    msg:t,
    time:Date.now(),
    reply:replyTo,
    seen:{},
    react:{}
  });
  textInput.value="";
  replyTo=null;
  replyArea.innerHTML="";
  typingRef.child(user).remove();
}

const tf=t=>{
  const d=new Date(t);
  return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
};

/* RECEIVE */
db.on("child_added",snap=>{
  const d=snap.val(),k=snap.key,isMe=d.name===user;
  const div=document.createElement("div");
  div.className="msg "+(isMe?"me":"");div.id=k;

  const avClass=d.gender==="nam"?"av-nam":d.gender==="nu"?"av-nu":"av-khac";
  const replyHTML=d.reply?`<div class="replyPreview"><b>${d.reply.name}</b>: ${d.reply.msg}</div>`:"";

  div.innerHTML=`
    <div class="reactionBar" id="react_${k}">
      ${REACTIONS.map(e=>`<span onclick="react('${k}','${e}')">${e}</span>`).join("")}
    </div>

    <div class="avatar ${avClass}">${d.name[0].toUpperCase()}</div>

    <div class="box">
      <div class="name">${d.name}</div>
      ${replyHTML}
      <div class="content">${d.msg}</div>
      <div class="reactionList" id="list_${k}"></div>
      <div class="time">${tf(d.time)}</div>
      ${isMe?`<div class="status">✔️ Đã gửi</div>`:""}
      <div class="replyBtn" onclick="setReply('${k}')">↩️ Trả lời</div>
      ${isMe?`<div class="delete" onclick="db.child('${k}').remove()">🗑️ Xóa</div>`:""}
    </div>
  `;

  div.oncontextmenu=e=>{
    e.preventDefault();
    document.querySelectorAll(".reactionBar").forEach(r=>r.style.display="none");
    document.getElementById("react_"+k).style.display="flex";
  };
  document.body.onclick=()=>document.querySelectorAll(".reactionBar").forEach(r=>r.style.display="none");

  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
});

db.on("child_changed",snap=>{
  const d=snap.val(),k=snap.key;
  const list=document.getElementById("list_"+k);
  if(list && d.react){
    list.innerHTML="";
    for(const e in d.react){
      const c=Object.keys(d.react[e]).length;
      if(c>0) list.innerHTML+=`<span>${e} ${c}</span>`;
    }
  }
});

function setReply(id){
  const m=document.getElementById(id);
  replyTo={name:m.querySelector(".name").innerText,msg:m.querySelector(".content").innerText};
  replyArea.innerHTML=`<div class="replyBox">Trả lời <b>${replyTo.name}</b>: ${replyTo.msg}<span class="close" onclick="replyTo=null;replyArea.innerHTML=''">✖</span></div>`;
}

let tmr;
textInput.oninput=()=>{
  typingRef.child(user).set(true);
  clearTimeout(tmr);
  tmr=setTimeout(()=>typingRef.child(user).remove(),1200);
};
typingRef.on("value",s=>{
  const o=Object.keys(s.val()||{}).filter(n=>n!==user);
  typing.innerText=o.length?o.join(", ")+" đang gõ...":"";
});
</script>

</body>
</html>
