<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
header{background:#4a90e2;color:#fff;padding:15px;text-align:center;font-size:20px}
#chat{height:calc(100vh - 170px);overflow-y:auto;padding:10px}
.msg{background:#fff;padding:10px;margin:8px 0;border-radius:8px;max-width:75%}
.me{background:#d9ecff;margin-left:auto;text-align:right}
.name{font-weight:bold;color:#4a90e2}
.time{font-size:11px;color:#888}
.delete{color:red;cursor:pointer;font-size:12px}
#typing{font-size:13px;color:#666;padding:5px 10px;height:20px}
#inputBox{display:flex;gap:5px;padding:10px;background:#fff}
input{flex:1;padding:10px;font-size:16px}
button{padding:10px 15px}
#loginBox{text-align:center;padding:20px}
</style>
</head>

<body>

<header>💬 UChat</header>

<!-- LOGIN -->
<div id="loginBox">
  <input id="username" placeholder="Nhập tên của bạn">
  <br><br>
  <button onclick="doLogin()">Vào chat</button>
</div>

<!-- CHAT -->
<div id="chat" style="display:none"></div>
<div id="typing"></div>

<!-- INPUT -->
<div id="inputBox" style="display:none">
  <input id="text" placeholder="Nhập tin nhắn...">
  <button onclick="send()">Gửi</button>
</div>

<!-- ÂM THANH -->
<audio id="notifySound">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-message-pop-alert-2354.mp3">
</audio>

<script>
/* ===== FIREBASE CONFIG ===== */
const firebaseConfig={
  apiKey:"AIzaSyCxxxxxxxxxxxxxxxxxxxx",
  authDomain:"uchat-406f4.firebaseapp.com",
  databaseURL:"https://uchat-406f4-default-rtdb.firebaseio.com",
  projectId:"uchat-406f4"
};
firebase.initializeApp(firebaseConfig);

const db=firebase.database().ref("uchat");
const typingRef=firebase.database().ref("typing");

/* ===== DOM ===== */
const chat=document.getElementById("chat");
const loginBox=document.getElementById("loginBox");
const inputBox=document.getElementById("inputBox");
const typing=document.getElementById("typing");
const notifySound=document.getElementById("notifySound");
const textInput=document.getElementById("text");

/* ===== USER ===== */
let user="";
let firstLoad=true;

/* ===== AUTO LOGIN ===== */
const saved=localStorage.getItem("uchat_name");
if(saved){
  user=saved;
  showChat();
}

/* ===== LOGIN ===== */
function doLogin(){
  const name=document.getElementById("username").value.trim();
  if(!name) return alert("Nhập tên!");
  user=name;
  localStorage.setItem("uchat_name",name);
  showChat();
}

function showChat(){
  loginBox.style.display="none";
  chat.style.display="block";
  inputBox.style.display="flex";
}

/* ===== SEND ===== */
function send(){
  const text=textInput.value.trim();
  if(!text) return;
  db.push({name:user,msg:text,time:Date.now()});
  textInput.value="";
  typingRef.child(user).remove();
}

/* ===== TIME ===== */
function timeFormat(t){
  const d=new Date(t);
  return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
}

/* ===== DELETE ===== */
function deleteMsg(id){
  if(confirm("Xóa tin nhắn?")) db.child(id).remove();
}

/* ===== RECEIVE ===== */
db.on("child_added",snap=>{
  const d=snap.val();
  const key=snap.key;
  const isMe=d.name===user;

  const div=document.createElement("div");
  div.className="msg "+(isMe?"me":"");
  div.id=key;

  div.innerHTML=`
    <div class="name">${d.name}</div>
    <div>${d.msg}</div>
    <div class="time">${timeFormat(d.time)}</div>
    ${isMe?`<div class="delete" onclick="deleteMsg('${key}')">🗑️ Xóa</div>`:""}
  `;

  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;

  // 🔔 CHỈ ÂM THANH – KHÔNG RUNG
  if(!firstLoad && !isMe){
    notifySound.play();
  }
  firstLoad=false;
});

/* ===== REMOVE ===== */
db.on("child_removed",snap=>{
  document.getElementById(snap.key)?.remove();
});

/* ===== TYPING ===== */
let typingTimer;
textInput.addEventListener("input",()=>{
  typingRef.child(user).set(true);
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>typingRef.child(user).remove(),1200);
});

typingRef.on("value",snap=>{
  const data=snap.val()||{};
  const others=Object.keys(data).filter(n=>n!==user);
  typing.innerText=others.length?others.join(", ")+" đang gõ...":"";
});
</script>

</body>
</html>
