<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
header{background:#4a90e2;color:#fff;padding:12px;display:flex;justify-content:space-between}
#logout{background:#ff4d4d;color:#fff;border:none;padding:6px 10px;border-radius:6px}

#chat{height:calc(100vh - 330px);overflow-y:auto;padding:10px}

.msg{background:#fff;padding:8px 10px;margin:6px 0;border-radius:14px;max-width:70%}
.me{background:#d9ecff;margin-left:auto}

.nameRow{display:flex;align-items:center;gap:6px}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold}
.male{background:#4a90e2}
.female{background:#ff6fa5}
.other{background:#888}

.name{font-weight:bold;font-size:13px}
.content{white-space:pre-wrap}
.time{font-size:11px;color:#888;text-align:right}
.status{font-size:11px;color:#4a90e2;text-align:right;cursor:pointer}

.replyPreview{background:#eef6ff;border-left:4px solid #4a90e2;padding:5px 8px;margin-bottom:4px;font-size:13px}
.replyBtn{font-size:12px;color:#4a90e2;cursor:pointer}
.delete{font-size:12px;color:red;cursor:pointer;text-align:right}

.seenBox{
  position:absolute;right:0;bottom:100%;
  background:#fff;padding:8px 10px;border-radius:10px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  font-size:13px;display:none;z-index:999
}

#replyBox{background:#eef6ff;border-left:4px solid #4a90e2;padding:6px 10px;margin-bottom:6px;position:relative}
#replyBox .close{position:absolute;right:6px;top:4px;cursor:pointer;color:red}

#typing{font-size:13px;color:#666;padding:5px 10px;height:18px}

#inputBox{padding:10px;background:#fff}
#sendRow{display:flex;gap:6px}
input,select{padding:10px;font-size:16px;width:100%}

#loginBox{text-align:center;padding:30px}
</style>
</head>

<body>

<header>
  💬 UChat
  <button id="logout" onclick="logout()">Đăng xuất</button>
</header>

<div id="loginBox">
  <input id="username" placeholder="Nhập tên"><br><br>
  <select id="genderSelect">
    <option value="">-- Chọn giới tính --</option>
    <option value="male">Nam</option>
    <option value="female">Nữ</option>
    <option value="other">Khác</option>
  </select><br><br>
  <button onclick="doLogin()">Vào chat</button>
</div>

<div id="chat" style="display:none"></div>
<div id="typing"></div>

<div id="inputBox" style="display:none">
  <div id="replyArea"></div>
  <div id="sendRow">
    <input id="text" placeholder="Nhập tin nhắn...">
    <button onclick="send()">Gửi</button>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCxxxxxxxxxxxx",
  authDomain:"uchat-406f4.firebaseapp.com",
  databaseURL:"https://uchat-406f4-default-rtdb.firebaseio.com",
  projectId:"uchat-406f4"
});

const db = firebase.database().ref("uchat");
const typingRef = firebase.database().ref("typing");

const chat = document.getElementById("chat");
const textInput = document.getElementById("text");
const replyArea = document.getElementById("replyArea");
const typing = document.getElementById("typing");

let userName = "";
let userGender = "";
let replyTo = null;

/* AUTO LOGIN */
const sn = localStorage.getItem("uchat_name");
const sg = localStorage.getItem("uchat_gender");
if(sn && sg){
  userName = sn;
  userGender = sg;
  showChat();
}

/* LOGIN – FIX 100% */
function doLogin(){
  const n = document.getElementById("username").value.trim();
  const g = document.getElementById("genderSelect").value;

  if(n === "" || g === ""){
    alert("Nhập tên & chọn giới tính");
    return;
  }

  userName = n;
  userGender = g;

  localStorage.setItem("uchat_name", n);
  localStorage.setItem("uchat_gender", g);

  showChat();
}

function showChat(){
  loginBox.style.display = "none";
  chat.style.display = "block";
  inputBox.style.display = "block";
}

/* LOGOUT */
function logout(){
  if(!confirm("Đăng xuất để đổi tên / giới tính?")) return;
  localStorage.clear();
  location.reload();
}

/* SEND */
function send(){
  const t = textInput.value.trim();
  if(!t) return;

  db.push({
    name: userName,
    gender: userGender,
    msg: t,
    reply: replyTo,
    time: Date.now(),
    seen:{}
  });

  textInput.value="";
  replyTo=null;
  replyArea.innerHTML="";
  typingRef.child(userName).remove();
}

/* TIME */
const tf = t => {
  const d = new Date(t);
  return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
};

/* RECEIVE */
db.on("child_added", snap=>{
  const d=snap.val(), k=snap.key, isMe=d.name===userName;
  const div=document.createElement("div");
  div.className="msg "+(isMe?"me":"");
  div.id=k;

  let replyHTML="";
  if(d.reply){
    replyHTML=`<div class="replyPreview"><b>${d.reply.name}</b>: ${d.reply.msg}</div>`;
  }

  div.innerHTML=`
    <div class="nameRow">
      <div class="avatar ${d.gender}">${d.name[0]}</div>
      <div class="name">${d.name}</div>
    </div>
    ${replyHTML}
    <div class="content">${d.msg}</div>
    <div class="time">${tf(d.time)}</div>
    ${isMe?`<div class="status" id="st_${k}">✔️</div>`:""}
    <div class="seenBox" id="seen_${k}"></div>
    <div class="replyBtn" onclick="setReply('${k}')">↩️ Trả lời</div>
    ${isMe?`<div class="delete" onclick="db.child('${k}').remove()">🗑️</div>`:""}
  `;

  if(!isMe){
    const obs=new IntersectionObserver(e=>{
      if(e[0].isIntersecting){
        db.child(k).child("seen").child(userName).set(true);
        obs.disconnect();
      }
    },{threshold:0.6});
    obs.observe(div);
  }

  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
});

/* UPDATE SEEN */
db.on("child_changed", snap=>{
  const d=snap.val(), k=snap.key;
  const st=document.getElementById("st_"+k);
  const box=document.getElementById("seen_"+k);
  if(d.seen && st){
    const names=Object.keys(d.seen);
    st.innerText=names.length>1?"✔✔":"✔️";
    box.innerHTML="<b>Đã xem:</b><br>"+names.join("<br>");
    st.onclick=()=>box.style.display=box.style.display==="block"?"none":"block";
  }
});

/* REPLY */
function setReply(id){
  const m=document.getElementById(id);
  replyTo={name:m.querySelector(".name").innerText,msg:m.querySelector(".content").innerText};
  replyArea.innerHTML=`
    <div id="replyBox">
      Trả lời <b>${replyTo.name}</b>: ${replyTo.msg}
      <span class="close" onclick="cancelReply()">✖</span>
    </div>`;
}
function cancelReply(){replyTo=null;replyArea.innerHTML="";}

/* TYPING */
let tmr;
textInput.oninput=()=>{
  typingRef.child(userName).set(true);
  clearTimeout(tmr);
  tmr=setTimeout(()=>typingRef.child(userName).remove(),1200);
};
typingRef.on("value", s=>{
  const o=Object.keys(s.val()||{}).filter(n=>n!==userName);
  typing.innerText=o.length?o.join(", ")+" đang gõ...":"";
});

/* DELETE */
db.on("child_removed", s=>{
  document.getElementById(s.key)?.remove();
});
</script>

</body>
</html>
