<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UChat</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
}
header {
  background: #4a90e2;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}
#chat {
  height: calc(100vh - 130px);
  overflow-y: auto;
  padding: 10px;
}
.msg {
  background: white;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  position: relative;
}
.name {
  font-weight: bold;
  color: #4a90e2;
  font-size: 14px;
}
.time {
  font-size: 12px;
  color: #888;
  margin-left: 5px;
}
.delete {
  position: absolute;
  top: 8px;
  right: 10px;
  cursor: pointer;
  color: red;
  font-size: 14px;
}
#input {
  display: flex;
  gap: 5px;
  padding: 10px;
  background: white;
}
input {
  flex: 1;
  padding: 10px;
  font-size: 16px;
}
button {
  padding: 10px 15px;
  font-size: 16px;
}
#login {
  padding: 20px;
  text-align: center;
}
</style>
</head>

<body>

<header>💬 UChat</header>

<!-- LOGIN -->
<div id="login">
  <input id="username" placeholder="Nhập tên của bạn" />
  <br><br>
  <button onclick="login()">Vào chat</button>
</div>

<!-- CHAT -->
<div id="chat" style="display:none"></div>

<!-- INPUT -->
<div id="input" style="display:none">
  <input id="text" placeholder="Nhập tin nhắn..." />
  <button onclick="send()">Gửi</button>
</div>

<script>
/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCxxxxxxxxxxxxxxxxxxxx",
  authDomain: "uchat-406f4.firebaseapp.com",
  databaseURL: "https://uchat-406f4-default-rtdb.firebaseio.com/",
  projectId: "uchat-406f4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("uchat");

/* ===== USER ===== */
let user = "";

/* ===== AUTO LOGIN ===== */
const savedName = localStorage.getItem("uchat_name");
if (savedName) {
  user = savedName;
  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "block";
  document.getElementById("input").style.display = "flex";
}

/* ===== LOGIN ===== */
function login() {
  const name = document.getElementById("username").value.trim();
  if (!name) return alert("Nhập tên trước đã!");

  user = name;
  localStorage.setItem("uchat_name", name);

  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "block";
  document.getElementById("input").style.display = "flex";
}

/* ===== SEND ===== */
function send() {
  const text = document.getElementById("text").value.trim();
  if (!text) return;

  db.push({
    name: user,
    msg: text,
    time: Date.now()
  });

  document.getElementById("text").value = "";
}

/* ===== FORMAT TIME ===== */
function formatTime(t) {
  const d = new Date(t);
  let h = d.getHours();
  let m = d.getMinutes();
  if (m < 10) m = "0" + m;
  return h + ":" + m;
}

/* ===== DELETE MESSAGE ===== */
function deleteMsg(key) {
  if (confirm("Xóa tin nhắn này?")) {
    db.child(key).remove();
    document.getElementById(key)?.remove();
  }
}

/* ===== RECEIVE ===== */
db.on("child_added", snap => {
  const data = snap.val();
  const key = snap.key;

  const div = document.createElement("div");
  div.className = "msg";
  div.id = key;

  div.innerHTML = `
    <div class="name">
      ${data.name}
      <span class="time">· ${formatTime(data.time)}</span>
    </div>
    <div>${data.msg}</div>
    ${data.name === user ? `<div class="delete" onclick="deleteMsg('${key}')">🗑️</div>` : ""}
  `;

  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop =
    document.getElementById("chat").scrollHeight;
});
</script>

</body>
</html>
