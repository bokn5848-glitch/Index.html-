```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Acc Luân Huỳnh - API Real</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050810; color: white; }
        .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .btn-blue { background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); }
        .status-badge { padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // CẤU HÌNH API GẠCH THẺ (Thay thông tin từ Pay1s của bạn vào đây)
        const API_CONFIG = {
            partner_id: "4042851548", 
            partner_key: "590f61b22707891909617cdf9466abf4",
            api_url: "https://pay1s.vn/api/card-auto/v2" // Ví dụ URL API của Pay1s
        };

        function App() {
            const [view, setView] = useState('auth'); 
            const [tab, setTab] = useState('buy'); 
            const [user, setUser] = useState(null);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [msg, setMsg] = useState({ text: '', type: '' });
            const [loading, setLoading] = useState(false);
            const [recharge, setRecharge] = useState({ telco: 'VIETTEL', amount: '10000', seri: '', pin: '' });

            const inventory = [
                { id: 101, name: "Acc Liên Quân Rank CT", price: 50000, data: "User: luanlq1 / Pass: luan2024" },
                { id: 102, name: "Netflix Premium 1 Tháng", price: 20000, data: "Email: net@luan.com / Pass: 9999" }
            ];

            const getUsers = () => JSON.parse(localStorage.getItem('shop_data_real') || '{}');
            const saveUsers = (users) => localStorage.setItem('shop_data_real', JSON.stringify(users));

            const handleLogin = () => {
                let users = getUsers();
                let name = username.toLowerCase();
                if(users[name] && users[name].password === password) {
                    setUser(users[name]); setView('shop'); setMsg("");
                } else if(!users[name]) {
                    // Tự động đăng ký nếu chưa có (Tiện cho khách)
                    users[name] = { username: name, password, balance: 0, history: [] };
                    saveUsers(users);
                    setUser(users[name]); setView('shop');
                } else {
                    setMsg({ text: "Sai mật khẩu!", type: "error" });
                }
            };

            // HÀM GỬI THẺ THẬT LÊN API
            const sendCardToAPI = async () => {
                if(!recharge.seri || !recharge.pin) return setMsg({ text: "Vui lòng nhập đủ Seri và Mã thẻ!", type: "error" });
                
                setLoading(true);
                setMsg({ text: "Đang gửi thẻ lên hệ thống xử lý...", type: "info" });

                try {
                    // Trong thực tế, bạn cần một file PHP trung gian để bảo mật Partner Key
                    // Đây là logic gửi dữ liệu:
                    const response = await fetch(API_CONFIG.api_url, {
                        method: 'POST',
                        body: JSON.stringify({
                            type: recharge.telco,
                            amount: recharge.amount,
                            serial: recharge.seri,
                            code: recharge.pin,
                            partner_id: API_CONFIG.partner_id,
                            request_id: Math.floor(Math.random() * 1000000).toString(),
                            sign: "md5_hash_chuoi_ky_tu_bao_mat" // Cần tạo mã sign theo hướng dẫn của API
                        })
                    });

                    // GIẢ LẬP PHẢN HỒI (Vì cần Host thật mới chạy được API)
                    setTimeout(() => {
                        if(recharge.pin.length < 10) {
                            setMsg({ text: `❌ THẺ THẤT BẠI: MÃ PIN ${recharge.pin} SAI HOẶC ĐÃ DÙNG!`, type: "error" });
                        } else {
                            let users = getUsers();
                            users[user.username].balance += parseInt(recharge.amount);
                            saveUsers(users);
                            setUser(users[user.username]);
                            setMsg({ text: `✅ NẠP THÀNH CÔNG! ĐÃ CỘNG ${parseInt(recharge.amount).toLocaleString()}đ`, type: "success" });
                            setRecharge({...recharge, seri: '', pin: ''});
                        }
                        setLoading(false);
                    }, 2000);

                } catch (error) {
                    setMsg({ text: "Lỗi kết nối API nạp thẻ!", type: "error" });
                    setLoading(false);
                }
            };

            const buyAcc = (item) => {
                if(user.balance < item.price) return alert("Bạn không đủ tiền!");
                let users = getUsers();
                users[user.username].balance -= item.price;
                users[user.username].history.push({ ...item, date: new Date().toLocaleString() });
                saveUsers(users);
                setUser(users[user.username]);
                alert("Mua thành công!"); setTab('history');
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col p-4">
                    {view === 'auth' ? (
                        <div className="my-auto glass p-8 rounded-[40px] border-t-2 border-blue-500 shadow-2xl">
                            <div className="text-center mb-10">
                                <h1 className="text-4xl font-black italic bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent uppercase">Luân Huỳnh</h1>
                                <p className="text-[9px] font-extrabold text-gray-500 tracking-[0.4em] uppercase mt-2">Nạp Thẻ Tự Động 24/7</p>
                            </div>
                            <div className="space-y-4">
                                <input type="text" placeholder="Tài khoản" value={username} onChange={e => setUsername(e.target.value)} className="w-full bg-black/40 border border-white/5 p-5 rounded-2xl outline-none focus:border-blue-500"/>
                                <input type="password" placeholder="Mật khẩu" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-black/40 border border-white/5 p-5 rounded-2xl outline-none focus:border-blue-500"/>
                                <button onClick={handleLogin} className="w-full btn-blue py-5 rounded-3xl font-black text-sm uppercase tracking-widest active:scale-95 transition-all">Đăng nhập / Đăng ký</button>
                            </div>
                            {msg.text && <p className="text-red-500 text-[10px] text-center mt-4 font-bold uppercase tracking-tighter">{msg.text}</p>}
                        </div>
                    ) : (
                        <div className="space-y-6 animate-in fade-in duration-500">
                            {/* Dashboard */}
                            <div className="glass p-6 rounded-[35px] border-b-4 border-blue-600 flex justify-between items-center shadow-2xl">
                                <div>
                                    <p className="text-[10px] text-gray-500 font-bold uppercase tracking-widest leading-none">Khách hàng</p>
                                    <h2 className="text-xl font-black text-blue-400 uppercase italic mt-1">{user.username}</h2>
                                </div>
                                <div className="text-right">
                                    <p className="text-[10px] text-gray-500 font-bold uppercase tracking-widest leading-none">Số dư ví</p>
                                    <h2 className="text-2xl font-black text-green-400 tracking-tighter">{user.balance.toLocaleString()}đ</h2>
                                </div>
                            </div>

                            {/* Tabs */}
                            <div className="flex bg-black/40 p-1.5 rounded-2xl">
                                <button onClick={() => setTab('buy')} className={`flex-1 py-3 rounded-xl text-[10px] font-black uppercase transition-all ${tab === 'buy' ? 'bg-blue-600 shadow-lg' : 'text-gray-500'}`}>Mua Acc</button>
                                <button onClick={() => setTab('history')} className={`flex-1 py-3 rounded-xl text-[10px] font-black uppercase transition-all ${tab === 'history' ? 'bg-blue-600 shadow-lg' : 'text-gray-500'}`}>Tủ Đồ ({user.history.length})</button>
                            </div>

                            {tab === 'buy' ? (
                                <div className="space-y-6">
                                    {/* Form nạp thẻ thật */}
                                    <div className="glass p-7 rounded-[40px] shadow-xl">
                                        <div className="flex items-center gap-2 mb-6">
                                            <div className="w-1 h-5 bg-blue-600 rounded-full"></div>
                                            <h3 className="text-[11px] font-black uppercase italic tracking-widest">Trung Tâm Nạp Thẻ (REAL)</h3>
                                        </div>
                                        
                                        {msg.text && (
                                            <div className={`mb-5 p-4 rounded-2xl text-[10px] font-bold text-center border animate-pulse ${
                                                msg.type === 'error' ? 'bg-red-500/10 border-red-500/30 text-red-500' : 
                                                msg.type === 'success' ? 'bg-green-500/10 border-green-500/30 text-green-500' : 
                                                'bg-blue-500/10 border-blue-500/30 text-blue-400'
                                            }`}>
                                                {msg.text}
                                            </div>
                                        )}

                                        <div className="space-y-4">
                                            <div className="grid grid-cols-2 gap-3">
                                                <div className="space-y-1">
                                                    <label className="text-[9px] font-bold text-gray-600 ml-2 uppercase">Loại thẻ</label>
                                                    <select value={recharge.telco} onChange={e => setRecharge({...recharge, telco: e.target.value})} className="w-full bg-black/40 p-4 rounded-2xl outline-none font-bold text-xs border border-white/5">
                                                        <option>VIETTEL</option><option>VINAPHONE</option><option>MOBIFONE</option>
                                                    </select>
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[9px] font-bold text-gray-600 ml-2 uppercase">Mệnh giá</label>
                                                    <select value={recharge.amount} onChange={e => setRecharge({...recharge, amount: e.target.value})} className="w-full bg-black/40 p-4 rounded-2xl outline-none font-bold text-blue-400 text-xs border border-white/5">
                                                        <option value="10000">10,000đ</option><option value="50000">50,000đ</option><option value="100000">100,000đ</option><option value="500000">500,000đ</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <input type="text" placeholder="Mã Seri" value={recharge.seri} onChange={e => setRecharge({...recharge, seri: e.target.value})} className="w-full bg-black/40 p-4 rounded-2xl outline-none border border-white/5 text-xs focus:border-blue-500"/>
                                            <input type="text" placeholder="Mã PIN" value={recharge.pin} onChange={e => setRecharge({...recharge, pin: e.target.value})} className="w-full bg-black/40 p-4 rounded-2xl outline-none border border-white/5 text-xs focus:border-blue-500"/>
                                            <button onClick={sendCardToAPI} disabled={loading} className="w-full btn-blue py-5 rounded-3xl font-black text-xs uppercase tracking-widest shadow-lg shadow-blue-500/20 active:scale-95 transition-all">
                                                {loading ? 'Hệ thống đang check thẻ...' : 'Xác nhận nạp ngay'}
                                            </button>
                                        </div>
                                    </div>

                                    {/* Sản phẩm */}
                                    <div className="space-y-3">
                                        <p className="text-[10px] font-bold text-gray-600 px-4 uppercase tracking-[0.3em]">Danh sách Acc</p>
                                        {inventory.map(item => (
                                            <div key={item.id} className="glass p-5 rounded-[30px] flex justify-between items-center hover:border-blue-500/30 transition-all">
                                                <div>
                                                    <h4 className="font-bold text-sm text-gray-200">{item.name}</h4>
                                                    <p className="text-blue-400 font-black text-xs">{item.price.toLocaleString()}đ</p>
                                                </div>
                                                <button onClick={() => buyAcc(item)} className="bg-white text-black px-6 py-2.5 rounded-2xl text-[10px] font-black uppercase hover:bg-blue-600 hover:text-white transition-all">Mua</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    <p className="text-[10px] font-bold text-gray-600 px-4 uppercase tracking-[0.3em]">Acc đã mua</p>
                                    {user.history.length === 0 ? (
                                        <div className="glass p-12 rounded-[40px] text-center border-dashed border-2 border-white/5">
                                            <p className="text-xs text-gray-600 italic">Tủ đồ đang trống...</p>
                                        </div>
                                    ) : (
                                        user.history.map((h, i) => (
                                            <div key={i} className="glass p-6 rounded-[35px] border-l-4 border-indigo-600">
                                                <div className="flex justify-between items-start mb-4">
                                                    <h4 className="font-black text-blue-400 text-xs uppercase italic">{h.name}</h4>
                                                    <span className="text-[8px] text-gray-600 font-bold uppercase">{h.date}</span>
                                                </div>
                                                <div className="bg-black/40 p-4 rounded-2xl border border-white/5 relative">
                                                    <p className="text-[9px] text-gray-500 mb-1 font-bold uppercase tracking-widest">Thông tin Acc:</p>
                                                    <code className="text-[11px] text-indigo-300 font-mono select-all">{h.data}</code>
                                                    <button onClick={() => {navigator.clipboard.writeText(h.data); alert("Đã copy!")}} className="absolute right-3 top-3 text-[9px] bg-white/10 px-3 py-1.5 rounded-lg font-bold">COPY</button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

```
